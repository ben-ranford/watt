name: Build and test

on:
  pull_request:
  push:
    branches: [main]

# contents: read is enough. Signing uses the system security tool and
# notarytool in this job. No third-party action sees the signing secrets.
# Fork pull requests do not import the keychain and stay ad-hoc.
# Same-repo pull requests and pushes to main use Developer ID when the
# secrets exist. The workflow is not triggered for an untrusted pull request head.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    # macos-15 tops out at Xcode 26.3. WattTests calls NSMenuItem.preferredImageVisibility,
    # which the macOS 27 SDK declares, so the job needs the Xcode 27 runner.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # No third-party packages today. The cache still keeps the SwiftPM build
      # directory so a later commit on the same PR can reuse compiled modules.
      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-27-spm-${{ hashFiles('Package.swift') }}-${{ hashFiles('**/*.swift') }}
          restore-keys: |
            xcode-27-spm-${{ hashFiles('Package.swift') }}-
            xcode-27-spm-

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Image default is Xcode 27.1. Prefer the newest 27.x already installed.
          selected=""
          for app in \
            /Applications/Xcode_27.2.app \
            /Applications/Xcode_27.1.app \
            /Applications/Xcode_27.app \
            /Applications/Xcode.app
          do
            if [[ -d "${app}" ]]; then
              selected="${app}"
              break
            fi
          done
          if [[ -z "${selected}" ]]; then
            echo "error: no Xcode found" >&2
            exit 1
          fi
          sudo xcode-select -s "${selected}"
          xcodebuild -version
          swift --version

      # Trusted refs only. Fork pull requests skip this step, so the Release
      # build below stays ad-hoc and the job still goes green. Secrets are
      # not passed to any other step.
      - name: Import Developer ID keychain
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          set +x
          bash scripts/developer-id.sh import

      - name: Build Debug and Release
        run: |
          set -euo pipefail
          set +x
          # Debug stays ad-hoc so the test host can be attached. Release uses
          # Developer ID when the temporary keychain was imported. Fork builds
          # have no keychain and stay ad-hoc. The WattHelperSigned scheme is
          # the local Apple Development configuration; this job does not build it.
          ad_hoc_sign=(
            "CODE_SIGN_IDENTITY=-"
            "CODE_SIGN_STYLE=Manual"
            "AD_HOC_CODE_SIGNING_ALLOWED=YES"
            "CODE_SIGNING_ALLOWED=YES"
            "COMPILER_INDEX_STORE_ENABLE=NO"
          )
          build_configuration() {
            local configuration="$1"
            # bash 3.2 on the runner rejects `local -a name=()`.
            sign=()
            update_settings=()
            if [[ "${configuration}" == "Release" && -f "${RUNNER_TEMP}/watt-developer-id/ready" ]]; then
              bash scripts/developer-id.sh unlock
              while IFS= read -r setting; do
                sign+=("${setting}")
              done < <(bash scripts/developer-id.sh xcode-settings)
              sign+=(
                "ENABLE_TESTABILITY=NO"
                "CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO"
                "COMPILER_INDEX_STORE_ENABLE=NO"
              )
            else
              sign=("${ad_hoc_sign[@]}")
            fi
            if [[ "${configuration}" == "Release" ]]; then
              while IFS= read -r setting; do
                update_settings+=("${setting}")
              done < <(python3 scripts/print_release_update_settings.py)
              if [[ ${#update_settings[@]} -ne 3 ]]; then
                echo "Release update settings were not loaded." >&2
                exit 1
              fi
            fi
            if [[ ${#update_settings[@]} -gt 0 ]]; then
              xcodebuild build \
                -project Watt.xcodeproj \
                -scheme Watt \
                -configuration "${configuration}" \
                -destination "generic/platform=macOS" \
                -derivedDataPath DerivedData \
                "${sign[@]}" \
                "${update_settings[@]}"
            else
              xcodebuild build \
                -project Watt.xcodeproj \
                -scheme Watt \
                -configuration "${configuration}" \
                -destination "generic/platform=macOS" \
                -derivedDataPath DerivedData \
                "${sign[@]}"
            fi
            local products="DerivedData/Build/Products/${configuration}"
            test -x "${products}/Watt.app/Contents/MacOS/Watt"
            test -x "${products}/WattHelper"
            test -x "${products}/WattMaintenance"
            test -x "${products}/WattHelperInstaller"
          }
          build_configuration Debug
          build_configuration Release

      # Xcode and SwiftPM compile the same tests differently. Several cases are
      # host-injected under xcodebuild and SWIFT_PACKAGE-only under `swift test`.
      # WattUITests drive the menu bar and are not part of this unit-test run.
      #
      # Recent pull requests finish this step in about a minute. Run 42806226910
      # (chore(main): release 1.1.0) failed after 68 minutes with no job record
      # and no log, so it was a lost xcode-27 runner rather than a failed
      # assertion. The 120s allowances match scripts/verify-native-host.sh and
      # fail one stuck test instead of waiting for the 90 minute job timeout.
      # The 10 minute watchdog covers xcodebuild itself never exiting (the
      # per-test allowance does not fire until a test starts). Retry once only
      # in that case. A real test failure is not retried.
      - name: Unit tests (xcodebuild)
        run: |
          set -euo pipefail
          export WATT_RESULT_BUNDLE="${RUNNER_TEMP}/WattTests.xcresult"
          export WATT_SCREENSHOT_DIR="${RUNNER_TEMP}/site-screenshots"
          mkdir -p "${WATT_SCREENSHOT_DIR}"
          bash scripts/retry_on_timeout.sh 600 1 -- \
            xcodebuild test \
            -project Watt.xcodeproj \
            -scheme Watt \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath DerivedData \
            -only-testing:WattTests \
            -resultBundlePath "${WATT_RESULT_BUNDLE}" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 120 \
            "CODE_SIGN_IDENTITY=-" \
            "CODE_SIGN_STYLE=Manual" \
            "AD_HOC_CODE_SIGNING_ALLOWED=YES" \
            "CODE_SIGNING_ALLOWED=YES" \
            "COMPILER_INDEX_STORE_ENABLE=NO"

      # xcodebuild does not pass WATT_SCREENSHOT_DIR into the test host.
      # SiteScreenshotTests writes site-screenshots/ next to the sources.
      # Copy that directory, including a hidden fallback, before upload.
      - name: Collect site screenshots
        if: always()
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/site-screenshots"
          mkdir -p "${dest}"
          for dir in site-screenshots .site-screenshots; do
            if [[ -d "${dir}" ]]; then
              cp -R "${dir}/." "${dest}/"
            fi
          done
          find "${dest}" -type f -print

      # always() keeps the render when the comparison fails, so the PNGs can
      # be committed. A missing directory does not fail this step.
      - name: Upload site screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-screenshots
          path: ${{ runner.temp }}/site-screenshots
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

      - name: Unit tests (swift test)
        run: |
          set -euo pipefail
          swift test --configuration debug

      # Same trusted-ref gate as the import step. Signs inside-out, notarises,
      # staples, then checks codesign and spctl. Fork jobs skip this step.
      - name: Notarise the Release app
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          set +x
          app="${GITHUB_WORKSPACE}/DerivedData/Build/Products/Release/Watt.app"
          test -d "${app}"
          if [[ ! -f "${RUNNER_TEMP}/watt-developer-id/ready" ]]; then
            echo "BLOCKED: trusted ref is missing the Developer ID keychain." >&2
            exit 1
          fi
          bash scripts/developer-id.sh sign-app "${app}"
          bash scripts/developer-id.sh notarize-app "${app}"
          bash scripts/developer-id.sh verify-app "${app}" --require-ticket

      # Pull-request runs only. This is a workflow artifact for a local Mac
      # install, not a GitHub Release or a Pages publish. A trusted ref zips
      # the stapled Developer ID app. A fork zips the ad-hoc build.
      # Developer ID artifacts set ENABLE_TESTABILITY=NO, so they do not carry
      # get-task-allow and cannot be attached in a debugger.
      - name: Zip the Release app
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          set +x
          app="${GITHUB_WORKSPACE}/DerivedData/Build/Products/Release/Watt.app"
          test -d "${app}"
          test -x "${app}/Contents/MacOS/Watt"
          if [[ -f "${RUNNER_TEMP}/watt-developer-id/ready" ]]; then
            codesign --verify --deep --strict --all-architectures --verbose=2 "${app}"
            /usr/sbin/spctl -a -vvv -t exec "${app}"
          else
            codesign --verify --verbose=2 "${app}"
          fi
          python3 scripts/print_release_update_settings.py --check-plist "${app}/Contents/Info.plist"
          mkdir -p "${RUNNER_TEMP}/watt-app-pr"
          ditto -c -k --keepParent "${app}" "${RUNNER_TEMP}/watt-app-pr/Watt.app.zip"

      - name: Upload the Release app
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Watt-app-pr
          path: ${{ runner.temp }}/watt-app-pr/Watt.app.zip
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Delete signing material
        if: always()
        run: |
          set -euo pipefail
          set +x
          bash scripts/developer-id.sh cleanup
