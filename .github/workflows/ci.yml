name: Build and test

on:
  pull_request:
  push:
    branches: [main]

# Read-only. Builds are ad-hoc; no signing identity or token is required,
# including on pull requests from forks.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    # macos-15 tops out at Xcode 26.3. WattTests calls NSMenuItem.preferredImageVisibility,
    # which the macOS 27 SDK declares, so the job needs the Xcode 27 runner.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # No third-party packages today. The cache still keeps the SwiftPM build
      # directory so a later commit on the same PR can reuse compiled modules.
      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-27-spm-${{ hashFiles('Package.swift') }}-${{ hashFiles('**/*.swift') }}
          restore-keys: |
            xcode-27-spm-${{ hashFiles('Package.swift') }}-
            xcode-27-spm-

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Image default is Xcode 27.1. Prefer the newest 27.x already installed.
          selected=""
          for app in \
            /Applications/Xcode_27.2.app \
            /Applications/Xcode_27.1.app \
            /Applications/Xcode_27.app \
            /Applications/Xcode.app
          do
            if [[ -d "${app}" ]]; then
              selected="${app}"
              break
            fi
          done
          if [[ -z "${selected}" ]]; then
            echo "error: no Xcode found" >&2
            exit 1
          fi
          sudo xcode-select -s "${selected}"
          xcodebuild -version
          swift --version

      - name: Build Debug and Release
        run: |
          set -euo pipefail
          # Ad-hoc signature (CODE_SIGN_IDENTITY=-). WattHelper, WattMaintenance,
          # and WattHelperInstaller enable the hardened runtime, so signing stays
          # allowed. The WattHelperSigned scheme is the configuration that requires
          # an Apple Development identity; this job does not build it.
          # The Watt scheme depends on those three helper tools, so one app build
          # per configuration produces them.
          sign=(
            "CODE_SIGN_IDENTITY=-"
            "CODE_SIGN_STYLE=Manual"
            "AD_HOC_CODE_SIGNING_ALLOWED=YES"
            "CODE_SIGNING_ALLOWED=YES"
            "COMPILER_INDEX_STORE_ENABLE=NO"
          )
          build_configuration() {
            local configuration="$1"
            xcodebuild build \
              -project Watt.xcodeproj \
              -scheme Watt \
              -configuration "${configuration}" \
              -destination "generic/platform=macOS" \
              -derivedDataPath DerivedData \
              "${sign[@]}"
            local products="DerivedData/Build/Products/${configuration}"
            test -x "${products}/Watt.app/Contents/MacOS/Watt"
            test -x "${products}/WattHelper"
            test -x "${products}/WattMaintenance"
            test -x "${products}/WattHelperInstaller"
          }
          build_configuration Debug
          build_configuration Release

      # The helper-absence check refuses removal when any powermetrics process
      # exists or when a process cannot be named. Print that table before tests
      # so a runner-specific refusal is visible in the log.
      - name: Process table relevant to helper absence
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/helper-absence-scan.c" << 'EOF'
          #include <errno.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <libproc.h>
          int main(void) {
            int estimate = proc_listallpids(NULL, 0);
            printf("estimate_bytes=%d\n", estimate);
            if (estimate <= 0) return 0;
            int cap = estimate / (int)sizeof(pid_t) + 128;
            pid_t *pids = calloc((size_t)cap, sizeof(pid_t));
            int count = proc_listallpids(pids, cap * (int)sizeof(pid_t));
            printf("count_bytes=%d\n", count);
            int n = count > 0 ? count / (int)sizeof(pid_t) : 0;
            for (int i = 0; i < n; i++) {
              pid_t pid = pids[i];
              if (pid <= 0) continue;
              char buf[4096];
              errno = 0;
              int len = proc_pidpath(pid, buf, sizeof(buf));
              if (len <= 0) {
                int saved = errno;
                char name[64] = {0};
                int nn = proc_name(pid, name, sizeof(name));
                printf("unreadable pid=%d errno=%d proc_name=%d name=%s\n", pid, saved, nn, nn > 0 ? name : "?");
              } else if (strcmp(buf, "/usr/bin/powermetrics") == 0 || strstr(buf, "WattHelper") != NULL) {
                printf("match pid=%d path=%s\n", pid, buf);
              }
            }
            return 0;
          }
          EOF
          clang -o "${RUNNER_TEMP}/helper-absence-scan" "${RUNNER_TEMP}/helper-absence-scan.c"
          "${RUNNER_TEMP}/helper-absence-scan"
          python3 - << 'PY'
          import os
          paths = [
              "/Library/Application Support/Watt/helper-trust.json",
              "/Library/PrivilegedHelperTools/dev.watt.verification.helper",
              "/Library/LaunchDaemons/dev.watt.verification.helper.plist",
          ]
          for path in paths:
              try:
                  st = os.lstat(path)
                  print(f"lstat exists mode={oct(st.st_mode)} {path}")
              except OSError as error:
                  print(f"lstat errno={error.errno} {error.strerror} {path}")
          PY
          cat > "${RUNNER_TEMP}/helper-absence.swift" << 'EOF'
          import Darwin
          import Foundation
          let estimate = proc_listallpids(nil, 0)
          print("swift estimate=\(estimate)")
          guard estimate > 0, estimate < 32_640 else { print("swift refuse estimate"); exit(0) }
          let capacity = Int(estimate) + 128
          var pids = [pid_t](repeating: 0, count: capacity)
          let count = pids.withUnsafeMutableBytes { proc_listallpids($0.baseAddress, Int32($0.count)) }
          print("swift count=\(count) capacity=\(capacity)")
          guard count > 0, count < capacity else { print("swift refuse count"); exit(0) }
          for pid in pids.prefix(Int(count)) where pid > 0 {
            var buffer = [CChar](repeating: 0, count: 4096)
            errno = 0
            let length = proc_pidpath(pid, &buffer, UInt32(buffer.count))
            if length <= 0 {
              let saved = errno
              let n = proc_name(pid, &buffer, UInt32(buffer.count))
              let name = n > 0 ? String(cString: buffer) : "?"
              print("swift unreadable pid=\(pid) errno=\(saved) proc_name=\(n) name=\(name)")
              if n <= 0 || name == "WattHelper" || name == "powermetrics" || name == "dev.watt.verification.helper" {
                print("swift refuse name")
              }
              continue
            }
            let path = String(cString: buffer)
            let base = URL(fileURLWithPath: path).lastPathComponent
            if path == "/Library/PrivilegedHelperTools/dev.watt.verification.helper" || path == "/usr/bin/powermetrics" || base == "WattHelper" {
              print("swift match pid=\(pid) path=\(path)")
            }
          }
          print("swift scan done")
          EOF
          swift "${RUNNER_TEMP}/helper-absence.swift"

      # Xcode and SwiftPM compile the same tests differently. Several cases are
      # host-injected under xcodebuild and SWIFT_PACKAGE-only under `swift test`.
      # WattUITests drive the menu bar and are not part of this unit-test run.
      - name: Unit tests (xcodebuild)
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Watt.xcodeproj \
            -scheme Watt \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath DerivedData \
            -only-testing:WattTests \
            -resultBundlePath "${RUNNER_TEMP}/WattTests.xcresult" \
            "CODE_SIGN_IDENTITY=-" \
            "CODE_SIGN_STYLE=Manual" \
            "AD_HOC_CODE_SIGNING_ALLOWED=YES" \
            "CODE_SIGNING_ALLOWED=YES" \
            "COMPILER_INDEX_STORE_ENABLE=NO"

      - name: Unit tests (swift test)
        if: success() || failure()
        run: |
          set -euo pipefail
          swift test --configuration debug
