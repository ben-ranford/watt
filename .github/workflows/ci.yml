name: Build and test

on:
  pull_request:
  push:
    branches: [main]

# Read-only. Builds are ad-hoc; no signing identity or token is required,
# including on pull requests from forks.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    # macos-15 tops out at Xcode 26.3. WattTests calls NSMenuItem.preferredImageVisibility,
    # which the macOS 27 SDK declares, so the job needs the Xcode 27 runner.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # No third-party packages today. The cache still keeps the SwiftPM build
      # directory so a later commit on the same PR can reuse compiled modules.
      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-27-spm-${{ hashFiles('Package.swift') }}-${{ hashFiles('**/*.swift') }}
          restore-keys: |
            xcode-27-spm-${{ hashFiles('Package.swift') }}-
            xcode-27-spm-

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Image default is Xcode 27.1. Prefer the newest 27.x already installed.
          selected=""
          for app in \
            /Applications/Xcode_27.2.app \
            /Applications/Xcode_27.1.app \
            /Applications/Xcode_27.app \
            /Applications/Xcode.app
          do
            if [[ -d "${app}" ]]; then
              selected="${app}"
              break
            fi
          done
          if [[ -z "${selected}" ]]; then
            echo "error: no Xcode found" >&2
            exit 1
          fi
          sudo xcode-select -s "${selected}"
          xcodebuild -version
          swift --version

      - name: Build Debug and Release
        run: |
          set -euo pipefail
          # Ad-hoc signature (CODE_SIGN_IDENTITY=-). WattHelper, WattMaintenance,
          # and WattHelperInstaller enable the hardened runtime, so signing stays
          # allowed. The WattHelperSigned scheme is the configuration that requires
          # an Apple Development identity; this job does not build it.
          # The Watt scheme depends on those three helper tools, so one app build
          # per configuration produces them.
          sign=(
            "CODE_SIGN_IDENTITY=-"
            "CODE_SIGN_STYLE=Manual"
            "AD_HOC_CODE_SIGNING_ALLOWED=YES"
            "CODE_SIGNING_ALLOWED=YES"
            "COMPILER_INDEX_STORE_ENABLE=NO"
          )
          build_configuration() {
            local configuration="$1"
            local -a update_settings=()
            if [[ "${configuration}" == "Release" ]]; then
              while IFS= read -r setting; do
                update_settings+=("${setting}")
              done < <(python3 scripts/print_release_update_settings.py)
              if [[ ${#update_settings[@]} -ne 3 ]]; then
                echo "Release update settings were not loaded." >&2
                exit 1
              fi
            fi
            if [[ ${#update_settings[@]} -gt 0 ]]; then
              xcodebuild build \
                -project Watt.xcodeproj \
                -scheme Watt \
                -configuration "${configuration}" \
                -destination "generic/platform=macOS" \
                -derivedDataPath DerivedData \
                "${sign[@]}" \
                "${update_settings[@]}"
            else
              xcodebuild build \
                -project Watt.xcodeproj \
                -scheme Watt \
                -configuration "${configuration}" \
                -destination "generic/platform=macOS" \
                -derivedDataPath DerivedData \
                "${sign[@]}"
            fi
            local products="DerivedData/Build/Products/${configuration}"
            test -x "${products}/Watt.app/Contents/MacOS/Watt"
            test -x "${products}/WattHelper"
            test -x "${products}/WattMaintenance"
            test -x "${products}/WattHelperInstaller"
          }
          build_configuration Debug
          build_configuration Release

      # Xcode and SwiftPM compile the same tests differently. Several cases are
      # host-injected under xcodebuild and SWIFT_PACKAGE-only under `swift test`.
      # WattUITests drive the menu bar and are not part of this unit-test run.
      #
      # Recent pull requests finish this step in about a minute. Run 42806226910
      # (chore(main): release 1.1.0) failed after 68 minutes with no job record
      # and no log, so it was a lost xcode-27 runner rather than a failed
      # assertion. The 120s allowances match scripts/verify-native-host.sh and
      # fail one stuck test instead of waiting for the 90 minute job timeout.
      # The 10 minute watchdog covers xcodebuild itself never exiting (the
      # per-test allowance does not fire until a test starts). Retry once only
      # in that case. A real test failure is not retried.
      - name: Unit tests (xcodebuild)
        run: |
          set -euo pipefail
          export WATT_RESULT_BUNDLE="${RUNNER_TEMP}/WattTests.xcresult"
          bash scripts/retry_on_timeout.sh 600 1 -- \
            xcodebuild test \
            -project Watt.xcodeproj \
            -scheme Watt \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath DerivedData \
            -only-testing:WattTests \
            -resultBundlePath "${WATT_RESULT_BUNDLE}" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 120 \
            "CODE_SIGN_IDENTITY=-" \
            "CODE_SIGN_STYLE=Manual" \
            "AD_HOC_CODE_SIGNING_ALLOWED=YES" \
            "CODE_SIGNING_ALLOWED=YES" \
            "COMPILER_INDEX_STORE_ENABLE=NO"

      - name: Unit tests (swift test)
        run: |
          set -euo pipefail
          swift test --configuration debug

      # Pull-request runs only. This is a workflow artifact for a local Mac
      # install, not a GitHub Release or a Pages publish. The Release app was
      # already ad-hoc signed by the build step (CODE_SIGN_IDENTITY=-).
      # The Release configuration keeps ENABLE_TESTABILITY, so Xcode adds
      # com.apple.security.get-task-allow to this artifact on purpose and it
      # can be attached in a debugger. scripts/release-archive.sh sets
      # ENABLE_TESTABILITY=NO for a published build, which does not carry it.
      - name: Zip the Release app
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          app="${GITHUB_WORKSPACE}/DerivedData/Build/Products/Release/Watt.app"
          test -d "${app}"
          test -x "${app}/Contents/MacOS/Watt"
          codesign --verify --verbose=2 "${app}"
          python3 scripts/print_release_update_settings.py --check-plist "${app}/Contents/Info.plist"
          mkdir -p "${RUNNER_TEMP}/watt-app-pr"
          ditto -c -k --keepParent "${app}" "${RUNNER_TEMP}/watt-app-pr/Watt.app.zip"

      - name: Upload the Release app
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Watt-app-pr
          path: ${{ runner.temp }}/watt-app-pr/Watt.app.zip
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
