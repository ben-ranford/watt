name: PR title

on:
  pull_request:
    # edited covers a title change and a description change, so a body edit re-runs this job.
    types: [opened, edited, reopened, synchronize, ready_for_review]

# Read-only. The title and description arrive in the environment, not in the shell.
permissions:
  contents: read

jobs:
  conventional-commit:
    name: Conventional commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the pull request title and description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python3 scripts/check_pr_title.py
