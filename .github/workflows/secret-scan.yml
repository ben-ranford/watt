name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

# Read-only. The job fails the check; it does not comment or request a token.
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          install -m 0755 gitleaks "${RUNNER_TEMP}/gitleaks"

      # Scan the tree that will remain after history is squashed to one commit.
      # A full-history scan still reports Figma file-key false positives in
      # commits from before the docs cleanup.
      - name: Scan working tree
        run: "${RUNNER_TEMP}/gitleaks" detect --no-git --source . --redact --verbose --config .gitleaks.toml
